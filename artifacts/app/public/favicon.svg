<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#0D0A06"/>
  <rect width="180" height="180" rx="36" fill="url(#grad)"/>
  <!-- Falcon silhouette -->
  <g transform="translate(90,90)">
    <!-- Head -->
    <ellipse cx="0" cy="-28" rx="16" ry="18" fill="#F5C97A"/>
    <!-- Beak -->
    <path d="M8,-22 L22,-18 L10,-12 Z" fill="#E8A020"/>
    <!-- Eye -->
    <circle cx="-3" cy="-30" r="4" fill="#1A0F08"/>
    <circle cx="-4" cy="-31" r="1.5" fill="#F5C97A"/>
    <!-- Body -->
    <ellipse cx="0" cy="5" rx="22" ry="28" fill="#D4891A"/>
    <!-- Wing left -->
    <path d="M-20,-5 L-58,15 L-42,25 L-15,8 Z" fill="#C47A10"/>
    <!-- Wing right -->
    <path d="M20,-5 L58,15 L42,25 L15,8 Z" fill="#C47A10"/>
    <!-- Wing detail left -->
    <path d="M-20,-2 L-55,18 L-50,22 L-18,5 Z" fill="#E8A020" opacity="0.6"/>
    <!-- Wing detail right -->
    <path d="M20,-2 L55,18 L50,22 L18,5 Z" fill="#E8A020" opacity="0.6"/>
    <!-- Tail -->
    <path d="M-12,28 L-18,58 L0,50 L18,58 L12,28 Z" fill="#C47A10"/>
    <!-- Chest highlight -->
    <ellipse cx="0" cy="5" rx="10" ry="14" fill="#F5C97A" opacity="0.3"/>
  </g>
  <defs>
    <radialGradient id="grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2A1A08"/>
      <stop offset="100%" stop-color="#0D0A06"/>
    </radialGradient>
  </defs>
</svg>
