<!DOCTYPE html>
<html lang="en" class="dark" style="background:#09090b;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0A06" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <title>DeepFalcon — Secure Location Intelligence</title>
    <meta name="description" content="Real-time location intelligence with surveillance-grade security. No app install required." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / WhatsApp link preview -->
    <meta property="og:title" content="DeepFalcon — Secure Location Intelligence" />
    <meta property="og:description" content="Tap to grant secure location access. No account required." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DeepFalcon — Secure Location Intelligence" />
    <meta name="twitter:description" content="Tap to grant secure location access. No account required." />

    <link rel="icon" type="image/png" href="/falcon-logo.png" />
    <link rel="apple-touch-icon" href="/falcon-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Inline critical CSS: dark background before JS/CSS loads -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0;padding:0;background:#0D0A06;color:#fafafa;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100dvh}
      #root{min-height:100dvh}
      #pre-react-loader{
        position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;background:#0D0A06;z-index:9999;gap:16px;
        transition:opacity .4s ease;
      }
      #pre-react-loader .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:#F5C97A;font-family:Syne,system-ui,sans-serif;letter-spacing:-0.02em}
      #pre-react-loader .brand img{width:36px;height:36px;border-radius:10px;object-fit:cover}
      #pre-react-loader .spinner{width:32px;height:32px;border:2px solid rgba(245,201,122,0.15);border-top-color:#F5C97A;border-radius:50%;animation:spin 0.8s linear infinite}
      #pre-react-loader .hint{font-size:12px;color:#78716c;letter-spacing:0.05em;font-family:monospace}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <!-- Pre-React loader: visible until React mounts and removes it -->
    <div id="pre-react-loader" aria-hidden="true">
      <div class="brand">
        <img src="/falcon-logo.png" alt="DeepFalcon" />
        DeepFalcon
      </div>
      <div class="spinner"></div>
      <span class="hint">INITIALIZING SECURE CONNECTION…</span>
    </div>

    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0D0A06;color:#fafafa;text-align:center;padding:24px;font-family:system-ui,sans-serif">
        <div>
          <div style="font-size:32px;margin-bottom:12px">🦅</div>
          <h2 style="margin:0 0 8px;font-size:18px">JavaScript Required</h2>
          <p style="margin:0;color:#78716c;font-size:14px">Please enable JavaScript to use DeepFalcon secure location intelligence.</p>
        </div>
      </div>
    </noscript>

    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
